apiVersion: apps/v1
kind: Deployment
metadata:
  name: rem-postgres
  namespace: rail-event-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rem-postgres
  template:
    metadata:
      labels:
        app: rem-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: rem-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rem-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rem-secret
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rem-postgres
  namespace: rail-event-monitor
spec:
  selector:
    app: rem-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
