apiVersion: apps/v1
kind: Deployment
metadata:
  name: rem-frontend
  namespace: rail-event-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rem-frontend
  template:
    metadata:
      labels:
        app: rem-frontend
    spec:
      containers:
        - name: frontend
          image: rail-event-monitor-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rem-frontend
  namespace: rail-event-monitor
spec:
  selector:
    app: rem-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
