apiVersion: apps/v1
kind: Deployment
metadata:
  name: rem-backend
  namespace: rail-event-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rem-backend
  template:
    metadata:
      labels:
        app: rem-backend
    spec:
      containers:
        - name: backend
          image: rail-event-monitor-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rem-config
            - secretRef:
                name: rem-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rem-backend
  namespace: rail-event-monitor
spec:
  selector:
    app: rem-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
