server:
  port: 8080

spring:
  application:
    name: rail-event-monitor
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rail_monitor}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  messaging:
    queue: train.events.queue
    exchange: train.events.exchange
    routing-key: train.events.key
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    jwt-expiration-seconds: 3600
